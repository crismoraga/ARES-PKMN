<html lang="es">
<head>

<title>ARES · Estación de monitoreo</title>
<style>
:root {
  --bg: #0b1018; --panel: #121a26; --panel-2: #172131; --line: #233047; --line-soft: #1b2638;
  --text: #e7edf6; --muted: #93a4ba; --faint: #64748b;
  --green: #4ade80; --green-soft: rgba(74, 222, 128, .14);
  --amber: #fbbf24; --amber-soft: rgba(251, 191, 36, .14);
  --red: #f87171; --red-soft: rgba(248, 113, 113, .14);
  --blue: #60a5fa; --blue-soft: rgba(96, 165, 250, .14);
  --violet: #a78bfa; --cyan: #22d3ee; --pink: #f472b6;
  --fr: #f97316; --em: #10b981;
  --radius: 12px; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6fa; --panel: #ffffff; --panel-2: #f6f8fb; --line: #dbe3ee; --line-soft: #e8eef5;
    --text: #0f172a; --muted: #475569; --faint: #94a3b8;
    --green: #16a34a; --amber: #b45309; --red: #dc2626; --blue: #2563eb;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
button { font: inherit; color: inherit; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
  padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: transparent; border: 1px solid transparent; padding: 6px 14px; border-radius: 999px;
  cursor: pointer; color: var(--muted); }
.tabs button:hover { color: var(--text); background: var(--panel); }
.tabs button.active { color: var(--text); background: var(--panel-2); border-color: var(--line); }
.tabs button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
.conn .led { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.conn .led.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
.conn .led.bad { background: var(--red); }
main { padding: 18px 20px 40px; max-width: 1680px; margin: 0 auto; }
[hidden] { display: none !important; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  display: flex; align-items: center; gap: 8px; }
.panel h3 .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.running { color: var(--green); background: var(--green-soft); border-color: transparent; }
.pill.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
.pill.bad { color: var(--red); background: var(--red-soft); border-color: transparent; }
.pill.idle { color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.screen-wrap { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 3 / 2; border: 1px solid var(--line); }
.screen-wrap img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.screen-wrap .overlay { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
  background: radial-gradient(circle, #111a 0, #000c 100%); font-size: 13px; text-align: center; padding: 20px; }
.screen-wrap .badge-scene { position: absolute; left: 10px; top: 10px; }
.screen-wrap .age { position: absolute; right: 10px; bottom: 8px; font: 11px var(--mono); color: #fff9;
  background: #0008; padding: 1px 6px; border-radius: 6px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value { font: 600 18px/1.3 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value small { font-size: 12px; color: var(--muted); font-weight: 400; }
.summary-card { display: flex; flex-direction: column; gap: 12px; }
.summary-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.summary-head h2 { margin: 0; font-size: 20px; }
.summary-head .gamebar { width: 6px; height: 26px; border-radius: 3px; }
.summary-head button { margin-left: auto; }
.btn { background: var(--panel-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; cursor: default; }
.objective { display: flex; flex-direction: column; gap: 6px; }
.objective .mode { font-weight: 600; }
.progress { height: 8px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--violet)); border-radius: 99px; transition: width .4s; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: var(--faint); }
.badge.on { border-color: var(--amber); color: #111; background: radial-gradient(circle at 35% 35%, #fde68a, var(--amber)); }
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mon { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.mon .top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.mon .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon .lvl { margin-left: auto; font: 600 12px var(--mono); color: var(--muted); }
.mon .status { font: 700 10px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--amber-soft); color: var(--amber); }
.hp { height: 6px; background: var(--line-soft); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
.hp > div { height: 100%; border-radius: 99px; transition: width .3s; }
.hp.xp { height: 3px; margin: 3px 0 0; } .hp.xp > div { background: var(--blue); }
.mon .hpnum { font: 11px var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
.types { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.type { font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 4px; color: #fff; text-transform: uppercase; letter-spacing: .03em; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.move { font-size: 11px; background: var(--bg); border-radius: 6px; padding: 3px 6px; border-left: 3px solid var(--line);
  display: flex; justify-content: space-between; gap: 4px; min-width: 0; }
.move span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.move .pp { font-family: var(--mono); color: var(--muted); }
.team.detail-team { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.team.compact { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.team.compact .mon { padding: 6px 8px; }
.team.compact .name { font-size: 12.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); min-width: 0; overflow-wrap: anywhere; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 6px 0 10px; }
.ladder div { font-size: 10px; text-align: center; padding: 5px 2px; border-radius: 6px; background: var(--panel-2);
  border: 1px solid var(--line-soft); color: var(--faint); }
.ladder div.done { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); background: var(--amber-soft); }
.ladder div.now { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.detail { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.wide { grid-column: 1 / -1; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.chart-box { position: relative; height: 210px; }
.chart-box canvas { width: 100%; height: 100%; display: block; }
.tooltip { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font: 11px var(--mono); white-space: nowrap; z-index: 3; box-shadow: 0 6px 18px #0006; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
tr:hover td { background: var(--panel-2); }
.scroll { max-height: 380px; overflow: auto; }
.risk { font-family: var(--mono); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: transparent; padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; color: var(--muted); }
.chip.active { color: var(--text); background: var(--panel-2); border-color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 74px 10px 1fr auto; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line-soft); }
.timeline .when { font: 11px var(--mono); color: var(--faint); text-align: right; }
.timeline .mark { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
.timeline .what { min-width: 0; overflow-wrap: anywhere; }
.timeline .frame { font: 11px var(--mono); color: var(--faint); }
.milestones { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; font-size: 12.5px; }
.milestones li { display: flex; gap: 8px; padding: 3px 4px; border-radius: 6px; }
.milestones li.done { color: var(--muted); }
.milestones li.done::before { content: "✓"; color: var(--green); width: 14px; }
.milestones li.next { background: var(--blue-soft); color: var(--text); font-weight: 600; }
.milestones li.next::before { content: "▶"; color: var(--blue); width: 14px; }
.milestones li.todo::before { content: "·"; color: var(--faint); width: 14px; text-align: center; }
.battle { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.battle .side .name { font-weight: 700; }
.battle .vs { font: 700 12px var(--mono); color: var(--faint); }
.errorbox { border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: var(--red-soft); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font: 12px var(--mono); overflow-wrap: anywhere; }
.empty { color: var(--faint); font-size: 13px; padding: 10px 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin: -4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
@media (max-width: 1180px) { .detail { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 920px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } .charts { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  main { padding: 12px 12px 30px; } .topbar { flex-wrap: wrap; padding: 8px 12px; } .conn { margin-left: 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">ARES <span>Estación de monitoreo</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="overview" class="active">Resumen</button>
    <button data-view="firered"><span class="dot" style="background:var(--fr)"></span>FireRed</button>
    <button data-view="emerald"><span class="dot" style="background:var(--em)"></span>Emerald</button>
    <button data-view="training">Entrenamiento</button>

  <div class="conn"><span class="led" id="led"></span><span id="conn-text">Conectando…</span><span class="num faint" id="clock"></span></div>
</header>
<main>

  <section class="view" id="view-firered" hidden></section>

</main>

async function control(game, action) {

    if (!response.ok) throw new Error(await response.text());
    toast(action === "stop" ? "Parada solicitada: el worker guardará y se detendrá." : "Guardado solicitado.");
  } catch (error) { toast(`No se pudo enviar la solicitud: ${error.message}`); }
}

}

function eventText(event) {
  const kind = event.kind;
  switch (kind) {
    case "native_battle_result": return `Resultado: ${OUTCOMES[event.outcome] || event.outcome}`;
    case "battle_entered": return event.trainer ? "Combate contra entrenador" : "Combate salvaje";
    case "milestone_observed": return `Objetivo completado: ${event.milestone}`;
    case "evolution": return `Evolución: ${event.from_name} → ${event.to_name}`;
    case "level_up": return `${event.name} sube a N${event.level}`;
    case "moves_changed": return `${event.name}: aprende ${(event.learned || []).join(", ") || "—"}${(event.forgotten || []).length ? `, olvida ${event.forgotten.join(", ")}` : ""}`;
    case "party_joined": return `Nuevo miembro: ${event.name} N${event.level}`;
    case "stall_detected": return `Atasco detectado (${event.recovery?.reason || ""}, intento ${event.recovery?.attempt ?? "?"}) en ${event.mode}`;
    case "stall_recovery": return `Recuperación ${event.attempt}: ${event.action}`;
    case "stall_rewind": return `Retroceso a ${event.target?.split(/[\\/]/).pop()} (fot. ${num(event.from_frame)} → ${num(event.to_frame)})`;
    case "agent_fault": return `Fallo contenido en ${event.where}: ${event.error}`;
    case "campaign_blocked": return `Ruta pendiente: ${event.reason}${event.suppressed_repeats ? ` (×${event.suppressed_repeats + 1})` : ""}`;
    case "map_transition": return `Mapa ${event.source?.join(":")} → ${event.destination?.join(":")}`;
    case "route_committed": return `Ruta fijada: salida ${event.exit?.join(",")} hacia ${event.via?.join(":")}`;
    case "transition_tabu": return `Salida vetada ${event.exit?.join(",")}: ${event.reason}`;
    case "exploration_detour": return `Desvío a ${event.target?.join(",")}: ${event.reason}`;
    case "checkpoint": return `Partida guardada (${CHECKPOINT_REASONS[event.reason] || event.reason})`;
    case "scene_started": return `Escena: ${SCENES[event.scene] || event.scene}`;
    case "battle_decision": return `Decisión: ${event.summary?.move || event.decision?.action}`;
    case "faint": return `Pokémon debilitado (posición ${event.party_index + 1})`;
    case "passage_refused": return `Paso denegado en ${event.map} ${event.tile?.join(",")}: requiere ${event.requirement} (aprendido, se evitará hasta cambiar el mundo)`;
    case "gate_requirement": return `Antes de pasar hace falta ${event.requirement}: ir a ${event.target}`;
    case "gate_relaxed": return `Sin ruta abierta: se verifica el paso cerrado (${event.reason})`;
    case "strategy_shift": return `Cambio de estrategia: ${STRATEGY_CHANGES[event.change] || event.change}`;
    case "objective_defeat": return `Derrota ante ${event.objective} (N${event.lead_level}) · ${event.prepared === false ? "entró sin curar: restaurar antes" : "preparado: subir nivel"}`;
    case "shop_opened": return "Tienda abierta: compra planificada";
    case "type_fact_learned": return `Aprendido: ${TYPE_ES[TYPE_ORDER[event.attack_type]] || event.attack_type} contra ${(event.defender_types || []).map(t => TYPE_ES[TYPE_ORDER[t]] || t).join("/")} es ${CATEGORY_ES[event.category] || event.category} (${event.origin === "opponent_move" ? "ataque rival" : "ataque propio"}; ${event.known_cells} casillas conocidas)`;
    case "counter_plan": return `Estrategia para ${event.objective}: atacar con ${(event.counter_types || []).map(t => TYPE_ES[TYPE_ORDER[t]] || t).join(", ")}${(event.catch_targets || []).length ? `; capturar candidatos #${event.catch_targets.join(", #")}` : ""}`;
    case "shop_closed": return `Compra terminada: ${Object.values(event.bought || {}).reduce((a, b) => a + b, 0)} objetos`;
    default: return EVENT_LABELS[kind] || kind;
  }
}

function renderCharts(game) {

        ["win_rate", "PPO · victorias en evaluación"], ["value_loss", "PPO · pérdida de valor"]].map(([key, title]) =>

/* ---------- Data loops ---------- */
function switchView(view) {
  state.view = view;
  for (const button of document.querySelectorAll("#tabs button")) button.classList.toggle("active", button.dataset.view === view);
  for (const name of ["overview", ...GAMES, "training"]) $(`#view-${name}`).hidden = name !== view;
  try { localStorage.setItem("ares-view", view); } catch (error) { /* storage may be blocked */ }
  if (location.hash !== `#${view}`) history.replaceState(null, "", `#${view}`);
  render(); refreshDetail(true);
}
function render() {
  if (!state.overview) return;
  if (state.view === "overview") renderOverview();
  else if (state.view === "training") renderTraining();
  else renderDetail(state.view);
}
async function refreshOverview() {
  try {
    state.overview = await getJSON("/api/overview");
    state.connected = true;
    $("#led").className = "led ok"; $("#conn-text").textContent = "Conectado";
    render();
  } catch (error) {
    state.connected = false; $("#led").className = "led bad"; $("#conn-text").textContent = "Sin conexión con el servidor";
  }
}
let lastDetail = 0, lastCharts = 0, lastCheckpoints = 0;
async function refreshDetail(force = false) {
  if (state.view === "training") {
    try { state.training = await getJSON("/api/training"); renderTraining(); } catch (error) { /* overview reports network health */ }
    return;
  }
  const games = state.view === "overview" ? GAMES : [state.view];
  const now = Date.now();
  try {
    if (force || now - lastCharts > 5000) {
      lastCharts = now;
      for (const game of games) state.telemetry[game] = await getJSON(`/api/telemetry/${game}?limit=900`);
      if (state.view !== "overview") renderCharts(state.view);
    }
    if (state.view === "overview") return;
    const game = state.view;
    if (force || now - lastDetail > 2000) {
      lastDetail = now;
      state.events[game] = await getJSON(`/api/events/${game}?limit=400`);
      state.decisions[game] = await getJSON(`/api/events/${game}?kinds=battle_decision&limit=40`);
      renderEvents(game); renderDecisions(game);
    }
    if (force || now - lastCheckpoints > 15000) {
      lastCheckpoints = now;
      state.checkpoints[game] = await getJSON(`/api/checkpoints/${game}`);
      renderCheckpoints(game);
    }
  } catch (error) { /* the overview loop reports connectivity */ }
}
const frameBusy = {};
function refreshFrames() {
  for (const img of document.querySelectorAll("img[data-frame]")) {
    if (img.offsetParent === null) continue;
    const game = img.dataset.frame;
    if (frameBusy[game]) continue;
    frameBusy[game] = true;
    const next = new Image();
    next.onload = () => { img.src = next.src; frameBusy[game] = false; };
    next.onerror = () => { frameBusy[game] = false; };
    next.src = `/api/frame/${game}.png?ts=${Date.now()}`;
  }
  for (const node of document.querySelectorAll("[data-age]")) {
    const published = statusOf(node.dataset.age).published_at;
    node.textContent = typeof published === "number" ? `hace ${ago(Date.now() / 1000 - published)}` : "";
  }
  $("#clock").textContent = new Date().toLocaleTimeString("es-CL");
}

document.querySelectorAll("#tabs button").forEach(button => button.addEventListener("click", () => switchView(button.dataset.view)));
let initial = location.hash.slice(1);
if (!initial) {
  try { initial = localStorage.getItem("ares-view") || "overview"; } catch (error) { initial = "overview"; }
}
if (!["overview", ...GAMES, "training"].includes(initial)) initial = "overview";
refreshOverview().then(() => switchView(initial));
setInterval(refreshOverview, 1000);
setInterval(() => refreshDetail(false), 1000);
setInterval(refreshFrames, 250);
</script>
